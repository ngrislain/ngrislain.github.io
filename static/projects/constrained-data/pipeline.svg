<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .file { fill: #eef3fa; stroke: #4a6fa5; stroke-width: 1.2; }
    .run  { fill: #eef7f1; stroke: #3f9d70; stroke-width: 1.2; }
    .shard{ fill: #fbf2e6; stroke: #c8853a; stroke-width: 1.2; }
    .lbl  { fill: #333; font-size: 13px; }
    .sub  { fill: #777; font-size: 11px; }
    .title{ fill: #222; font-size: 14px; font-weight: 600; }
    .arrow{ stroke: #999; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .peak { fill: #3f9d70; font-size: 12px; font-weight: 600; }
    .peakbox { fill: #eef7f1; stroke: #3f9d70; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="358" rx="10" fill="#fafafa" stroke="#e6e6e6"/>

  <!-- column dividers -->
  <line x1="298" y1="30" x2="298" y2="248" stroke="#ececec" stroke-width="1"/>
  <line x1="588" y1="30" x2="588" y2="248" stroke="#ececec" stroke-width="1"/>

  <!-- Phase A -->
  <text class="title" x="40" y="48">A. make sorted runs</text>
  <text class="sub" x="40" y="66">fill the pool, sort, spill, free, repeat</text>
  <rect class="file" x="40"  y="92"  width="78" height="48" rx="5"/>
  <rect class="file" x="40"  y="104" width="78" height="48" rx="5"/>
  <rect class="file" x="40"  y="116" width="78" height="48" rx="5"/>
  <text class="lbl" x="79" y="145" text-anchor="middle">31 days</text>
  <text class="sub" x="79" y="160" text-anchor="middle">JSONL</text>
  <path class="arrow" d="M122 140 L166 140"/>
  <rect class="run" x="168" y="98"  width="96" height="32" rx="5"/>
  <text class="lbl" x="216" y="118" text-anchor="middle">run ≤ 100</text>
  <rect class="run" x="168" y="138" width="96" height="32" rx="5"/>
  <text class="lbl" x="216" y="158" text-anchor="middle">run ≤ 100</text>
  <rect class="run" x="168" y="178" width="96" height="32" rx="5"/>
  <text class="lbl" x="216" y="198" text-anchor="middle">run ≤ 100</text>

  <!-- Phase B -->
  <text class="title" x="320" y="48">B. pairwise merge</text>
  <text class="sub" x="320" y="66">stream both runs, one frontier each</text>
  <path class="arrow" d="M268 114 L320 132"/>
  <path class="arrow" d="M268 154 L320 144"/>
  <rect class="run" x="322" y="122" width="92" height="32" rx="5"/>
  <text class="lbl" x="368" y="142" text-anchor="middle">merged</text>
  <path class="arrow" d="M268 194 L320 186"/>
  <rect class="run" x="322" y="176" width="92" height="32" rx="5"/>
  <text class="lbl" x="368" y="196" text-anchor="middle">merged</text>
  <path class="arrow" d="M418 138 L456 156"/>
  <path class="arrow" d="M418 192 L456 168"/>
  <rect class="run" x="458" y="146" width="104" height="38" rx="5"/>
  <text class="lbl" x="510" y="170" text-anchor="middle">one sorted run</text>

  <!-- Phase C -->
  <text class="title" x="610" y="48">C. shard pass</text>
  <text class="sub" x="610" y="66">stream per entity, chunk at the cap</text>
  <path class="arrow" d="M566 165 L606 165"/>
  <rect class="shard" x="608" y="96"  width="86" height="28" rx="5"/>
  <text class="lbl" x="651" y="115" text-anchor="middle">shard 0</text>
  <rect class="shard" x="608" y="130" width="86" height="28" rx="5"/>
  <text class="lbl" x="651" y="149" text-anchor="middle">shard 1</text>
  <rect class="shard" x="608" y="164" width="86" height="28" rx="5"/>
  <text class="lbl" x="651" y="183" text-anchor="middle">...</text>
  <rect class="shard" x="608" y="198" width="86" height="28" rx="5"/>
  <text class="lbl" x="651" y="217" text-anchor="middle">shard 9</text>

  <!-- peak memory per phase -->
  <text class="sub" x="450" y="278" text-anchor="middle">peak event slots held in memory</text>
  <rect class="peakbox" x="60"  y="292" width="200" height="34" rx="6"/>
  <text class="peak" x="160" y="314" text-anchor="middle">≤ 100 (one run)</text>
  <rect class="peakbox" x="350" y="292" width="200" height="34" rx="6"/>
  <text class="peak" x="450" y="314" text-anchor="middle">2 (the frontiers)</text>
  <rect class="peakbox" x="640" y="292" width="200" height="34" rx="6"/>
  <text class="peak" x="740" y="314" text-anchor="middle">≤ 100 (one entity)</text>
</svg>
