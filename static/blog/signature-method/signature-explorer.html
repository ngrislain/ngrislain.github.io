<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Path Signature Explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
  onload="renderAllMath()"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f7f8fa; color: #23272f;
  line-height: 1.5; padding: 1rem;
}
.container { max-width: 960px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin-bottom: .2rem; }
.subtitle { color: #6b7280; font-size: .85rem; margin-bottom: .8rem; }
.tabs { display: flex; gap: 2px; margin-bottom: .8rem; }
.tab-btn {
  padding: .45rem .9rem; border: none; background: #e5e7eb; color: #374151;
  cursor: pointer; font-size: .82rem; border-radius: 6px 6px 0 0; transition: background .15s;
}
.tab-btn.active { background: #fff; color: #2563eb; font-weight: 600; }
.tab-btn:hover:not(.active) { background: #d1d5db; }
.tab-content { display: none; background: #fff; border-radius: 0 6px 6px 6px;
  padding: .8rem; border: 1px solid #e5e7eb; }
.tab-content.active { display: block; }
.panel { display: flex; gap: .8rem; flex-wrap: wrap; }
.canvas-col { flex: 1 1 340px; min-width: 300px; }
.info-col { flex: 1 1 280px; min-width: 250px; max-height: 480px; overflow-y: auto; }
.canvas-wrap {
  position: relative; background: #fff;
  border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden;
}
.canvas-wrap canvas { display: block; cursor: crosshair; width: 100%; height: auto; }
.btn-row { display: flex; gap: .4rem; margin-top: .4rem; flex-wrap: wrap; align-items: center; }
.btn {
  padding: .3rem .7rem; border: 1px solid #d1d5db; background: #fff;
  border-radius: 4px; font-size: .78rem; cursor: pointer; color: #374151;
}
.btn:hover { background: #f3f4f6; }
.btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
.btn.primary:hover { background: #1d4ed8; }
.sig-header { font-weight: 600; font-size: .85rem; margin-bottom: .3rem; }
.sig-level { margin-bottom: .5rem; }
.sig-level-title { font-size: .75rem; color: #6b7280; font-weight: 600; margin-bottom: .15rem; }
.sig-term { display: flex; align-items: center; gap: .4rem; font-size: .78rem; margin-bottom: .15rem; }
.sig-label { min-width: 50px; text-align: right; font-family: 'KaTeX_Main', serif; }
.sig-bar-wrap { flex: 1; height: 14px; background: #f3f4f6; border-radius: 3px; position: relative; overflow: hidden; }
.sig-bar { height: 100%; border-radius: 3px; transition: width .2s; position: absolute; }
.sig-bar.pos { background: #3b82f6; left: 50%; }
.sig-bar.neg { background: #ef4444; right: 50%; }
.sig-val { min-width: 55px; font-size: .72rem; color: #6b7280; font-variant-numeric: tabular-nums; }
select { font-size: .8rem; }
label { font-size: .8rem; color: #4b5563; }
.match-table { font-size: .78rem; width: 100%; border-collapse: collapse; margin-top: .4rem; }
.match-table td, .match-table th { padding: .2rem .4rem; border-bottom: 1px solid #f3f4f6; text-align: right; }
.match-table th { text-align: center; }
.match-table td:first-child { text-align: left; }
.match-table .ok { color: #16a34a; }
.match-table .diff { color: #dc2626; }
.status-bar {
  font-size: .75rem; color: #6b7280; margin-top: .4rem; padding: .3rem .5rem;
  background: #f9fafb; border-radius: 4px;
}
</style>
</head>
<body>
<div class="container">
  <h1>Path Signature Explorer</h1>
  <p class="subtitle">Draw 2D paths and explore their truncated signatures</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('draw')">Draw &amp; Compute</button>
    <button class="tab-btn" onclick="switchTab('recon')">Reconstruction</button>
  </div>

  <!-- Tab 1: Draw & Compute -->
  <div id="tab-draw" class="tab-content active">
    <div class="panel">
      <div class="canvas-col">
        <div class="canvas-wrap"><canvas id="c1" width="400" height="400"></canvas></div>
        <div class="btn-row">
          <button class="btn" onclick="undo(drawState); redrawTab1();">Undo</button>
          <button class="btn" onclick="drawState.points=[]; redrawTab1();">Clear</button>
          <label>Truncation level:
            <select id="level1" onchange="redrawTab1();">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>
        </div>
      </div>
      <div class="info-col" id="sig-display-1"></div>
    </div>
  </div>

  <!-- Tab 2: Reconstruction -->
  <div id="tab-recon" class="tab-content">
    <div class="panel">
      <div class="canvas-col">
        <div class="canvas-wrap"><canvas id="c2" width="400" height="400"></canvas></div>
        <div class="btn-row">
          <button class="btn" onclick="undo(reconState); stopRecon(); reconState.chain=null; redrawTab2();">Undo</button>
          <button class="btn" onclick="stopRecon(); reconState.points=[]; reconState.chain=null; redrawTab2();">Clear</button>
          <label>Level:
            <select id="recon-level" onchange="stopRecon(); reconState.chain=null; redrawTab2();">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>
          <span id="degree-info" style="font-size:.75rem;color:#6b7280;"></span>
          <button class="btn primary" id="recon-btn" onclick="startRecon();">Reconstruct</button>
        </div>
      </div>
      <div class="info-col" id="sig-display-2"></div>
    </div>
  </div>
</div>

<script>
// ===================== COORDINATE SYSTEM =====================
const W = 400, H = 400;
const WORLD_MIN = -2, WORLD_MAX = 2, WORLD_RANGE = 4;

function w2c(wx, wy) {
  return [(wx - WORLD_MIN) / WORLD_RANGE * W, (WORLD_MAX - wy) / WORLD_RANGE * H];
}
function c2w(cx, cy) {
  return [WORLD_MIN + cx / W * WORLD_RANGE, WORLD_MAX - cy / H * WORLD_RANGE];
}
function getWorld(canvas, e) {
  const r = canvas.getBoundingClientRect();
  return c2w((e.clientX - r.left) * (canvas.width / r.width),
             (e.clientY - r.top) * (canvas.height / r.height));
}

// ===================== SIGNATURE ENGINE =====================
const FACT = [1,1,2,6,24,120,720,5040];

function idSig(N) {
  const s = [new Float64Array([1])];
  for (let k = 1; k <= N; k++) s[k] = new Float64Array(1 << k);
  return s;
}

function tExp(d, N) {
  const s = [new Float64Array([1])];
  for (let k = 1; k <= N; k++) {
    const sz = 1 << k;
    s[k] = new Float64Array(sz);
    for (let idx = 0; idx < sz; idx++) {
      let p = 1, t = idx;
      for (let j = 0; j < k; j++) { p *= d[t & 1]; t >>= 1; }
      s[k][idx] = p / FACT[k];
    }
  }
  return s;
}

function tProd(A, B, N) {
  const C = [];
  for (let k = 0; k <= N; k++) {
    const sz = k === 0 ? 1 : (1 << k);
    C[k] = new Float64Array(sz);
    for (let idx = 0; idx < sz; idx++) {
      let sum = 0;
      for (let m = 0; m <= k; m++) {
        const r = k - m;
        const ai = m === 0 ? 0 : (r === 0 ? idx : idx >> r);
        const bi = r === 0 ? 0 : (m === 0 ? idx : idx & ((1 << r) - 1));
        sum += A[m][ai] * B[r][bi];
      }
      C[k][idx] = sum;
    }
  }
  return C;
}

function sigOf(pts, N) {
  if (pts.length < 2) return idSig(N);
  let s = idSig(N);
  for (let i = 1; i < pts.length; i++)
    s = tProd(s, tExp([pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]], N), N);
  return s;
}

function sigMSE(a, b, N) {
  let err = 0, cnt = 0;
  for (let k = 1; k <= N; k++)
    for (let idx = 0; idx < a[k].length; idx++) {
      const d = a[k][idx] - b[k][idx];
      err += d * d; cnt++;
    }
  return err / cnt;
}

// ===================== POLYNOMIAL DEGREE THEORY =====================
function mobius(n) {
  if (n === 1) return 1;
  let tmp = n, nf = 0;
  for (let p = 2; p * p <= tmp; p++) {
    if (tmp % p === 0) { nf++; tmp /= p; if (tmp % p === 0) return 0; }
  }
  if (tmp > 1) nf++;
  return nf % 2 === 0 ? 1 : -1;
}

function wittDim(d, k) {
  // Dimension of free Lie algebra at grade k on d generators
  let s = 0;
  for (let m = 1; m <= k; m++) if (k % m === 0) s += mobius(k / m) * Math.pow(d, m);
  return s / k;
}

function minPolyDegree(N) {
  // Minimum polynomial degree to match level-N truncated signature (d=2, fixed endpoints)
  if (N <= 1) return N;
  let free = 0;
  for (let k = 2; k <= N; k++) free += wittDim(2, k);
  return Math.max(N, Math.ceil(free / 2) + 1);
}

// ===================== BÉZIER CURVES =====================
function bezierPath(cx, cy, nPts) {
  const n = cx.length - 1;
  const pts = new Array(nPts + 1);
  const bx = new Float64Array(n + 1), by = new Float64Array(n + 1);
  for (let s = 0; s <= nPts; s++) {
    const t = s / nPts;
    for (let i = 0; i <= n; i++) { bx[i] = cx[i]; by[i] = cy[i]; }
    for (let r = 1; r <= n; r++)
      for (let i = 0; i <= n - r; i++) {
        bx[i] = (1 - t) * bx[i] + t * bx[i + 1];
        by[i] = (1 - t) * by[i] + t * by[i + 1];
      }
    pts[s] = [bx[0], by[0]];
  }
  return pts;
}

// ===================== CHOLESKY SOLVER =====================
function solveCholesky(A, b, n) {
  const L = [];
  for (let i = 0; i < n; i++) L[i] = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= i; j++) {
      let s = A[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) return null; L[i][j] = Math.sqrt(s); }
      else L[i][j] = s / L[j][j];
    }
  }
  const y = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let s = b[i]; for (let k = 0; k < i; k++) s -= L[i][k] * y[k]; y[i] = s / L[i][i];
  }
  const x = new Float64Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let s = y[i]; for (let k = i + 1; k < n; k++) s -= L[k][i] * x[k]; x[i] = s / L[i][i];
  }
  return x;
}

function miStr(k, idx) {
  let s = '';
  for (let j = k - 1; j >= 0; j--) s += ((idx >> j) & 1) === 0 ? 'x' : 'y';
  return s;
}

// ===================== RENDERING =====================
function renderAllMath() {
  document.querySelectorAll('.math-label').forEach(el => {
    if (!el.dataset.rendered) {
      try { katex.render(el.dataset.formula, el, {throwOnError: false}); }
      catch(e) { el.textContent = el.dataset.formula; }
      el.dataset.rendered = '1';
    }
  });
}
function msp(f) {
  return '<span class="math-label" data-formula="' + f.replace(/"/g, '&quot;') + '"></span>';
}

function renderSig(id, sig) {
  const el = document.getElementById(id);
  if (!sig) { el.innerHTML = '<p style="color:#9ca3af;font-size:.8rem;">Click on the canvas to draw a path</p>'; return; }
  const N = sig.length - 1;
  let mx = 0;
  for (let k = 0; k <= N; k++)
    for (let i = 0; i < sig[k].length; i++) mx = Math.max(mx, Math.abs(sig[k][i]));
  if (mx === 0) mx = 1;
  let h = '';
  for (let k = 0; k <= N; k++) {
    h += '<div class="sig-level"><div class="sig-level-title">Level ' + k + '</div>';
    for (let i = 0; i < sig[k].length; i++) {
      const v = sig[k][i];
      const lb = k === 0 ? '1' : 'S^{' + miStr(k, i) + '}';
      const pct = Math.min(Math.abs(v) / mx * 50, 50);
      const cls = v >= 0 ? 'pos' : 'neg';
      const bs = v >= 0 ? 'left:50%;width:'+pct+'%' : 'right:50%;width:'+pct+'%';
      h += '<div class="sig-term"><div class="sig-label">' + msp(lb) + '</div>'
        + '<div class="sig-bar-wrap"><div class="sig-bar ' + cls + '" style="' + bs + '"></div></div>'
        + '<div class="sig-val">' + v.toFixed(3) + '</div></div>';
    }
    h += '</div>';
  }
  el.innerHTML = h;
  renderAllMath();
}

// ===================== CANVAS =====================
function drawGrid(ctx) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 0.5;
  for (let v = WORLD_MIN; v <= WORLD_MAX; v += 0.5) {
    const [cx] = w2c(v, 0); const [, cy] = w2c(0, v);
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
  }
  ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1;
  const [ax, ay] = w2c(0, 0);
  ctx.beginPath(); ctx.moveTo(ax, 0); ctx.lineTo(ax, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, ay); ctx.lineTo(W, ay); ctx.stroke();
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  for (let v = WORLD_MIN; v <= WORLD_MAX; v += 1) {
    if (v === 0) continue;
    const [cx] = w2c(v, 0); const [, cy] = w2c(0, v);
    ctx.fillText(v.toString(), cx, ay + 12);
    ctx.textAlign = 'right'; ctx.fillText(v.toString(), ax - 4, cy + 3); ctx.textAlign = 'center';
  }
  ctx.fillText('x', W - 8, ay - 4); ctx.fillText('y', ax + 10, 12);
  ctx.restore();
}

function drawPath(ctx, pts, color, lw, showPts) {
  if (pts.length < 1) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = lw || 2;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  const [sx, sy] = w2c(pts[0][0], pts[0][1]);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < pts.length; i++) {
    const [cx, cy] = w2c(pts[i][0], pts[i][1]);
    ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  ctx.restore();
  if (showPts) {
    pts.forEach((p, i) => {
      const [cx, cy] = w2c(p[0], p[1]);
      ctx.beginPath(); ctx.arc(cx, cy, i === 0 ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = i === 0 ? color : '#fff'; ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
    });
  }
}

function undo(st) { if (st.points.length > 0) st.points.pop(); }

// ===================== TABS =====================
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['draw','recon'][i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// ===================== TAB 1: DRAW & COMPUTE =====================
const drawState = { points: [] };

function redrawTab1() {
  const c = document.getElementById('c1');
  drawGrid(c.getContext('2d'));
  drawPath(c.getContext('2d'), drawState.points, '#3b82f6', 2.5, true);
  const N = parseInt(document.getElementById('level1').value);
  renderSig('sig-display-1', drawState.points.length >= 2 ? sigOf(drawState.points, N) : null);
}

document.getElementById('c1').addEventListener('click', function(e) {
  drawState.points.push(getWorld(this, e));
  redrawTab1();
});

// ===================== TAB 2: RECONSTRUCTION =====================
const reconState = { points: [], chain: null, running: false, animId: null };

function redrawTab2() {
  const c = document.getElementById('c2');
  const ctx = c.getContext('2d');
  drawGrid(ctx);
  if (reconState.chain) drawPath(ctx, reconState.chain, '#f67280', 1.5, false);
  drawPath(ctx, reconState.points, '#3b82f6', 2.5, true);
  updateReconInfo();
}

function updateReconInfo() {
  const el = document.getElementById('sig-display-2');
  const N = parseInt(document.getElementById('recon-level').value);
  const deg = minPolyDegree(N);
  const nP = 2 * Math.max(0, deg - 1);
  const di = document.getElementById('degree-info');
  if (di) di.textContent = ' \u2192 degree ' + deg + ' (' + nP + ' params)';

  if (reconState.points.length < 2) {
    el.innerHTML = '<p style="color:#9ca3af;font-size:.8rem;">Draw a path, then click Reconstruct.<br><br>'
      + 'Finds a degree-' + deg + ' B\u00e9zier curve whose truncated signature matches the target at level ' + N + '. '
      + 'The polynomial degree is the minimum from the Witt formula for the free Lie algebra. '
      + 'Several random initialisations are tried and the smoothest solution (smallest sup-norm) is kept.</p>';
    return;
  }
  const origSig = sigOf(reconState.points, N);
  if (!reconState.chain) {
    renderSig('sig-display-2', origSig);
    return;
  }
  const reconSig = sigOf(reconState.chain, N);
  const mse = sigMSE(origSig, reconSig, N);

  let h = '<div class="sig-header">Degree ' + deg + ' B\u00e9zier vs. target (level ' + N + ')</div>';
  h += '<table class="match-table"><tr><th></th><th>Original</th><th>Recon.</th><th></th></tr>';
  for (let k = 0; k <= N; k++) {
    for (let idx = 0; idx < origSig[k].length; idx++) {
      const lb = k === 0 ? '1' : 'S^{' + miStr(k, idx) + '}';
      const ov = origSig[k][idx], rv = reconSig[k][idx];
      const d = Math.abs(ov - rv), ma = Math.max(Math.abs(ov), 1e-9);
      const ok = d / ma < 0.05;
      h += '<tr><td>' + msp(lb) + '</td><td>' + ov.toFixed(4) + '</td><td>' + rv.toFixed(4)
        + '</td><td class="' + (ok ? 'ok' : 'diff') + '">' + (ok ? '&#10003;' : '&#10007;') + '</td></tr>';
    }
    if (k < N) h += '<tr><td colspan="4" style="border-bottom:2px solid #e5e7eb;"></td></tr>';
  }
  h += '</table>';
  h += '<div class="status-bar" id="recon-status">MSE: ' + mse.toExponential(2) + '</div>';
  el.innerHTML = h;
  renderAllMath();
}

function stopRecon() {
  reconState.running = false;
  if (reconState.animId) { cancelAnimationFrame(reconState.animId); reconState.animId = null; }
  document.getElementById('recon-btn').textContent = 'Reconstruct';
}

function lmSolve(params, nP, nRes, getRes, maxIter, fdh) {
  let lambda = 1e-3;
  for (let iter = 0; iter < maxIter; iter++) {
    const [r0] = getRes(params);
    let cost0 = 0;
    for (let i = 0; i < nRes; i++) cost0 += r0[i] * r0[i];
    if (isNaN(cost0) || !isFinite(cost0) || cost0 < 1e-20) return cost0;

    const J = [];
    for (let i = 0; i < nRes; i++) J[i] = new Float64Array(nP);
    for (let p = 0; p < nP; p++) {
      const old = params[p];
      params[p] = old + fdh;
      const [rP] = getRes(params);
      params[p] = old;
      for (let i = 0; i < nRes; i++) J[i][p] = (rP[i] - r0[i]) / fdh;
    }

    const JTJ = [];
    for (let i = 0; i < nP; i++) JTJ[i] = new Float64Array(nP);
    const JTr = new Float64Array(nP);
    for (let i = 0; i < nP; i++) {
      for (let j = i; j < nP; j++) {
        let s = 0;
        for (let k = 0; k < nRes; k++) s += J[k][i] * J[k][j];
        JTJ[i][j] = s; JTJ[j][i] = s;
      }
      JTJ[i][i] += lambda;
      let s = 0;
      for (let k = 0; k < nRes; k++) s += J[k][i] * r0[k];
      JTr[i] = s;
    }

    const delta = solveCholesky(JTJ, JTr.map(v => -v), nP);
    if (!delta) { lambda *= 10; continue; }

    const saved = new Float64Array(params);
    for (let p = 0; p < nP; p++) params[p] += delta[p];
    const [r1] = getRes(params);
    let cost1 = 0;
    for (let i = 0; i < nRes; i++) cost1 += r1[i] * r1[i];

    if (cost1 < cost0) { lambda = Math.max(lambda * 0.3, 1e-10); }
    else { for (let p = 0; p < nP; p++) params[p] = saved[p]; lambda = Math.min(lambda * 3, 1e8); }
  }
  const [rF] = getRes(params);
  let c = 0; for (let i = 0; i < nRes; i++) c += rF[i] * rF[i];
  return c;
}

function startRecon() {
  if (reconState.points.length < 2) return;
  if (reconState.running) { stopRecon(); return; }

  const N = parseInt(document.getElementById('recon-level').value);
  const target = sigOf(reconState.points, N);
  const start = reconState.points[0];
  const end   = reconState.points[reconState.points.length - 1];
  const deg   = minPolyDegree(N);
  const nFree = deg - 1;
  const nP    = 2 * nFree;
  const nSample = 64;

  let nRes = 0;
  for (let k = 1; k <= N; k++) nRes += (1 << k);

  if (nP === 0) {
    reconState.chain = [start.slice(), end.slice()];
    redrawTab2();
    return;
  }

  function randn() {
    const u1 = Math.random(), u2 = Math.random();
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }

  function buildCtrl(p) {
    const cx = [start[0]], cy = [start[1]];
    for (let i = 0; i < nFree; i++) { cx.push(p[2 * i]); cy.push(p[2 * i + 1]); }
    cx.push(end[0]); cy.push(end[1]);
    return [cx, cy];
  }

  function getRes(p) {
    const [cx, cy] = buildCtrl(p);
    const path = bezierPath(cx, cy, nSample);
    const sig  = sigOf(path, N);
    const r = new Float64Array(nRes);
    let idx = 0;
    for (let k = 1; k <= N; k++)
      for (let j = 0; j < sig[k].length; j++)
        r[idx++] = sig[k][j] - target[k][j];
    return [r, path];
  }

  const nTrials = 8;
  const maxIter = 200, fdh = 1e-4;
  let bestParams = null, bestSup = Infinity;
  let trial = 0;

  reconState.running = true;
  const btn = document.getElementById('recon-btn');
  const spinId = setInterval(() => {
    btn.textContent = '\u21BB ' + trial + '/' + nTrials;
  }, 120);

  function runTrial() {
    if (!reconState.running) { clearInterval(spinId); btn.textContent = 'Reconstruct'; return; }

    if (trial < nTrials) {
      const p = new Float64Array(nP);
      const noise0 = 0.5 / Math.sqrt(nFree);
      for (let i = 0; i < nFree; i++) {
        const t = (i + 1) / (nFree + 1);
        p[2 * i]     = start[0] + t * (end[0] - start[0]) + noise0 * randn();
        p[2 * i + 1] = start[1] + t * (end[1] - start[1]) + noise0 * randn();
      }

      const cost = lmSolve(p, nP, nRes, getRes, maxIter, fdh);
      if (cost <= 1e-6) {
        let sup = 0;
        for (let i = 0; i < nFree; i++) {
          const t = (i + 1) / (nFree + 1);
          const lx = start[0] + t * (end[0] - start[0]);
          const ly = start[1] + t * (end[1] - start[1]);
          sup = Math.max(sup, Math.abs(p[2 * i] - lx), Math.abs(p[2 * i + 1] - ly));
        }
        if (sup < bestSup) { bestSup = sup; bestParams = new Float64Array(p); }
      }

      trial++;
      setTimeout(runTrial, 0);
      return;
    }

    // All trials done
    clearInterval(spinId);

    if (!bestParams) {
      bestParams = new Float64Array(nP);
      const noise0 = 0.5 / Math.sqrt(nFree);
      for (let i = 0; i < nFree; i++) {
        const t = (i + 1) / (nFree + 1);
        bestParams[2 * i]     = start[0] + t * (end[0] - start[0]) + noise0 * randn();
        bestParams[2 * i + 1] = start[1] + t * (end[1] - start[1]) + noise0 * randn();
      }
      lmSolve(bestParams, nP, nRes, getRes, maxIter, fdh);
    }

    const [, bestPath] = getRes(bestParams);
    reconState.chain = bestPath;
    reconState.running = false;
    btn.textContent = 'Reconstruct';
    redrawTab2();
  }

  setTimeout(runTrial, 0);
}

document.getElementById('c2').addEventListener('click', function(e) {
  reconState.points.push(getWorld(this, e));
  stopRecon();
  reconState.chain = null;
  redrawTab2();
});

// ===================== INIT =====================
redrawTab1();
redrawTab2();
</script>
