<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Herdr process ownership</title>
<desc id="desc">A laptop client attaches over SSH to a remote Herdr server. The server owns agent and test panes. Each independent change uses its own checkout.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#176f68" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="650" rx="18" fill="#faf8f1"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="41" font-size="15" fill="#176f68" font-weight="700" letter-spacing="2" text-anchor="start">HERDR / THE PROCESS MODEL</text>
<text x="40" y="82" font-size="30" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Close the view. Keep the work running.</text>
<rect x="40" y="130" width="255" height="390" rx="12" fill="#e5efeb" stroke="#c8d1ca" stroke-width="1.5"/>
<text x="62" y="169" font-size="16" fill="#176f68" font-weight="700" letter-spacing="1.5" text-anchor="start">LAPTOP</text>
<rect x="62" y="195" width="211" height="122" rx="12" fill="white" stroke="#c8d1ca" stroke-width="1.5"/>
<text x="82" y="235" font-size="23" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Herdr client</text>
<text x="82" y="269" font-size="18" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">Displays terminals</text>
<text x="82" y="295" font-size="18" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">Sends your input</text>
<text x="62" y="378" font-size="20" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">Detach or close</text>
<text x="62" y="407" font-size="20" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">this client.</text>
<text x="62" y="436" font-size="20" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">The remote server</text>
<text x="62" y="465" font-size="20" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">still owns the work.</text>
<path d="M304,255 L412,255" fill="none" stroke="#176f68" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="359" y="225" font-size="18" fill="#176f68" font-weight="700" letter-spacing="0" text-anchor="middle">SSH</text>
<text x="359" y="304" font-size="15" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="middle">reconnect</text>
<rect x="430" y="130" width="530" height="442" rx="12" fill="#f0f2ed" stroke="#c8d1ca" stroke-width="1.5"/>
<text x="454" y="169" font-size="16" fill="#176f68" font-weight="700" letter-spacing="1.5" text-anchor="start">REMOTE EXECUTION HOST</text>
<rect x="454" y="195" width="482" height="92" rx="12" fill="#e5efeb" stroke="#176f68" stroke-width="1.5"/>
<text x="477" y="232" font-size="24" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Herdr server</text>
<text x="477" y="263" font-size="20" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">Owns terminals and running processes</text>
<path d="M568,288 L568,332" fill="none" stroke="#176f68" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M822,288 L822,332" fill="none" stroke="#176f68" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="454" y="344" width="228" height="139" rx="12" fill="white" stroke="#c8d1ca" stroke-width="1.5"/>
<text x="472" y="378" font-size="21" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Implementation</text>
<text x="472" y="410" font-size="18" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">Agent + shell</text>
<text x="472" y="439" font-size="18" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">worktree: feature</text>
<rect x="708" y="344" width="228" height="139" rx="12" fill="white" stroke="#c8d1ca" stroke-width="1.5"/>
<text x="726" y="378" font-size="21" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Review / tests</text>
<text x="726" y="410" font-size="18" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">Agent or command</text>
<text x="726" y="439" font-size="18" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">worktree: review</text>
<text x="454" y="535" font-size="20" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">The host must remain awake and available.</text>
<text x="40" y="625" font-size="16" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">01 / Client lifetime and process lifetime are separate.</text>
</g></svg>
