<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Persistence is not the same as recovery</title>
<desc id="desc">Detaching keeps processes alive. Sleeping pauses work on the laptop but not on an awake remote host. A server restart loses original processes; restored layout and supported conversation resume are different.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#176f68" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="660" rx="18" fill="#faf8f1"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="41" font-size="15" fill="#176f68" font-weight="700" letter-spacing="2" text-anchor="start">HERDR / INTERRUPTION BOUNDARIES</text>
<text x="40" y="82" font-size="30" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">What actually survives?</text>
<text x="64" y="139" font-size="15" fill="#526366" font-weight="700" letter-spacing="1.5" text-anchor="start">EVENT</text>
<text x="330" y="139" font-size="15" fill="#526366" font-weight="700" letter-spacing="1.5" text-anchor="start">ORIGINAL PROCESSES</text>
<text x="650" y="139" font-size="15" fill="#526366" font-weight="700" letter-spacing="1.5" text-anchor="start">WHEN YOU RETURN</text>
<rect x="40" y="164" width="920" height="118" rx="12" fill="#e5efeb" stroke="#e5efeb" stroke-width="1.5"/>
<text x="64" y="211" font-size="22" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Detach the client</text>
<text x="330" y="206" font-size="20" fill="#176f68" font-weight="400" letter-spacing="0" text-anchor="start">Keep running</text>
<text x="330" y="237" font-size="20" fill="#176f68" font-weight="400" letter-spacing="0" text-anchor="start">on the execution host</text>
<text x="650" y="206" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">Attach to the same</text>
<text x="650" y="237" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">live terminals</text>
<rect x="40" y="304" width="920" height="118" rx="12" fill="#eef0ec" stroke="#eef0ec" stroke-width="1.5"/>
<text x="64" y="351" font-size="22" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Sleep the laptop</text>
<text x="330" y="346" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">Remote host: continues</text>
<text x="330" y="377" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">Laptop host: pauses</text>
<text x="650" y="346" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">Location determines</text>
<text x="650" y="377" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">whether work progressed</text>
<rect x="40" y="444" width="920" height="118" rx="12" fill="#f3e7cf" stroke="#f3e7cf" stroke-width="1.5"/>
<text x="64" y="491" font-size="22" fill="#213437" font-weight="700" letter-spacing="0" text-anchor="start">Restart the server</text>
<text x="330" y="486" font-size="20" fill="#8e5716" font-weight="400" letter-spacing="0" text-anchor="start">Original processes stop</text>
<text x="330" y="517" font-size="20" fill="#8e5716" font-weight="400" letter-spacing="0" text-anchor="start">New processes required</text>
<text x="650" y="486" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">Saved layout returns</text>
<text x="650" y="517" font-size="20" fill="#213437" font-weight="400" letter-spacing="0" text-anchor="start">Agent resume if supported</text>
<text x="40" y="635" font-size="16" fill="#526366" font-weight="400" letter-spacing="0" text-anchor="start">02 / A recovered conversation is not an uninterrupted test run.</text>
</g></svg>
